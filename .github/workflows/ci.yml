name: Mira Protect CI

on:
  push:
    branches:
      - main
      - develop/**
      - chatgpt/**
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MIRA_DATABASE_URL: sqlite+pysqlite:///:memory:
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

      - name: Import smoke test
        run: python -c "from mira_protect.app import app; print(app.title, app.version)"

  build-windows-endpoint:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install agent build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Build single-file Windows endpoint agent
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --onefile --name MiraProtectAgent src/mira_protect/endpoint_agent.py

      - name: Assemble enterprise test bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle | Out-Null
          Copy-Item dist/MiraProtectAgent.exe bundle/MiraProtectAgent.exe
          Copy-Item scripts/install-windows-agent.ps1 bundle/install-windows-agent.ps1
          Copy-Item scripts/uninstall-windows-agent.ps1 bundle/uninstall-windows-agent.ps1
          Copy-Item scripts/test-endpoint-protection.ps1 bundle/test-endpoint-protection.ps1
          Copy-Item config/endpoint-agent.example.json bundle/endpoint-agent.example.json
          if (Test-Path docs/enterprise-device-test.md) {
            Copy-Item docs/enterprise-device-test.md bundle/enterprise-device-test.md
          }
          Compress-Archive -Path bundle/* -DestinationPath MiraProtect-Windows-Endpoint-Test.zip -Force

      - name: Upload Windows endpoint test artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiraProtect-Windows-Endpoint-Test
          path: MiraProtect-Windows-Endpoint-Test.zip
          retention-days: 14

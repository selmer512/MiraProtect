services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      MIRA_DATABASE_URL: postgresql+psycopg://mira:mira@postgres:5432/mira
      MIRA_REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mira
      POSTGRES_USER: mira
      POSTGRES_PASSWORD: mira
    volumes:
      - mira-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

volumes:
  mira-postgres:

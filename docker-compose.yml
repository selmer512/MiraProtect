services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      MIRA_DATABASE_URL: postgresql+psycopg://mira:mira@postgres:5432/mira
      MIRA_REDIS_URL: redis://redis:6379/0
      MIRA_ENDPOINT_TOKEN: ${MIRA_ENDPOINT_TOKEN:-}
      MIRA_ENDPOINT_DENY_PROCESSES: ${MIRA_ENDPOINT_DENY_PROCESSES:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mira
      POSTGRES_USER: mira
      POSTGRES_PASSWORD: mira
    volumes:
      - mira-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mira -d mira"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  mira-postgres:

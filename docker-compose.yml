services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      MIRA_DATABASE_URL: postgresql+psycopg://mira:mira@postgres:5432/mira
      MIRA_REDIS_URL: redis://redis:6379/0
      MIRA_ENDPOINT_TOKEN: ${MIRA_ENDPOINT_TOKEN:-}
      MIRA_POLICY_VERSION: ${MIRA_POLICY_VERSION:-2026.09.03-1}
      MIRA_ENDPOINT_ALLOW_PROCESSES: ${MIRA_ENDPOINT_ALLOW_PROCESSES:-}
      MIRA_ENDPOINT_DENY_PROCESSES: ${MIRA_ENDPOINT_DENY_PROCESSES:-}
      MIRA_APPROVED_AI_PROVIDERS: ${MIRA_APPROVED_AI_PROVIDERS:-}
      MIRA_ENABLE_TEST_CONTROLS: ${MIRA_ENABLE_TEST_CONTROLS:-true}
      MIRA_OFFLINE_FAIL_CLOSED_ALLOWED: ${MIRA_OFFLINE_FAIL_CLOSED_ALLOWED:-false}
      MIRA_DEVICE_STALE_SECONDS: ${MIRA_DEVICE_STALE_SECONDS:-180}
      MIRA_DEVICE_OFFLINE_SECONDS: ${MIRA_DEVICE_OFFLINE_SECONDS:-900}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mira
      POSTGRES_USER: mira
      POSTGRES_PASSWORD: mira
    volumes:
      - mira-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mira -d mira"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  mira-postgres:

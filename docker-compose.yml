services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      MIRA_DATABASE_URL: postgresql+psycopg://mira:mira@postgres:5432/mira
      MIRA_REDIS_URL: redis://redis:6379/0
      MIRA_ENROLLMENT_TOKEN: ${MIRA_ENROLLMENT_TOKEN:-}
      MIRA_TOKEN_PEPPER: ${MIRA_TOKEN_PEPPER:-}
      MIRA_ENDPOINT_TOKEN: ${MIRA_ENDPOINT_TOKEN:-}
      MIRA_ALLOW_SHARED_ENDPOINT_TOKEN: ${MIRA_ALLOW_SHARED_ENDPOINT_TOKEN:-false}
      MIRA_ENDPOINT_DENY_PROCESSES: ${MIRA_ENDPOINT_DENY_PROCESSES:-}
      MIRA_ENDPOINT_PROCESS_NAMES: ${MIRA_ENDPOINT_PROCESS_NAMES:-}
      MIRA_ENDPOINT_COMMAND_MARKERS: ${MIRA_ENDPOINT_COMMAND_MARKERS:-}
      MIRA_ENDPOINT_FAIL_CLOSED: ${MIRA_ENDPOINT_FAIL_CLOSED:-false}
      MIRA_ENDPOINT_POLICY_MODE: ${MIRA_ENDPOINT_POLICY_MODE:-monitor}
      MIRA_POLICY_REFRESH_SECONDS: ${MIRA_POLICY_REFRESH_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mira
      POSTGRES_USER: mira
      POSTGRES_PASSWORD: mira
    volumes:
      - mira-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mira -d mira"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  mira-postgres:
